<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- TODO: SEO / Open Graph 标签,待与用户确认后添加(见 CLAUDE.md「尚未锁定事项」) -->
  <!-- TODO: 姓名文案确定后更新 <title> -->
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    Bento 网格布局(见 CLAUDE.md「页面结构」):桌面端一屏内完整展示全部
    模块,不出现滚动条;平板/手机端堆叠为纵向滚动。模块顺序即 DOM 顺序,
    身份卡在前,与移动端"身份卡为第一个堆叠模块"的要求天然一致。
    内容量较大的模块(Skills / Experience / CineVerse 技术亮点详情)可
    点击展开为居中弹层,交互逻辑见 render.js。
  -->
  <main id="bento-grid" class="bento-grid">
    <section class="bento-card identity" id="card-identity" aria-label="Identity">
      <div id="identity-mount" class="mount"></div>
    </section>

    <section
      class="bento-card cineverse is-expandable"
      id="card-cineverse"
      data-expand="cineverse"
      tabindex="0"
      role="button"
      aria-haspopup="dialog"
      aria-label="Featured project: CineVerse — click to view full details"
    >
      <div id="project-mount" class="mount"></div>
    </section>

    <section class="bento-card techstack" id="card-techstack" aria-label="Tech stack">
      <div id="techstack-mount" class="mount"></div>
    </section>

    <section class="bento-card stats" id="card-stats" aria-label="Key stat">
      <div id="stats-mount" class="mount"></div>
    </section>

    <section
      class="bento-card skills is-expandable"
      id="card-skills"
      data-expand="skills"
      tabindex="0"
      role="button"
      aria-haspopup="dialog"
      aria-label="Skills — click to view full details"
    >
      <div id="skills-mount" class="mount"></div>
    </section>

    <section
      class="bento-card experience is-expandable"
      id="card-experience"
      data-expand="experience"
      tabindex="0"
      role="button"
      aria-haspopup="dialog"
      aria-label="Experience — click to view full details"
    >
      <div id="experience-mount" class="mount"></div>
    </section>

    <section class="bento-card contact" id="card-contact" aria-label="Contact">
      <div id="contact-mount" class="mount"></div>
    </section>
  </main>

  <!-- 点击展开弹层:遮罩 + 居中面板。展开/收起的"软弹"动画由 render.js
       通过内联 transform 计算(来源卡片 rect ↔ 弹层 rect),CSS 只提供
       静态布局与过渡属性声明。 -->
  <div id="overlay-root" class="overlay-root" aria-hidden="true">
    <div id="overlay-backdrop" class="overlay-backdrop"></div>
    <div
      id="overlay-panel"
      class="overlay-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="overlay-title"
    >
      <button id="overlay-close" class="overlay-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
      <div id="overlay-content" class="overlay-content"></div>
    </div>
  </div>

  <!-- 普通 script(非 type="module"):理由见 render.js 顶部注释 -->
  <script src="content.js"></script>
  <script src="render.js"></script>
</body>
</html>
