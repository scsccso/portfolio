<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- TODO: SEO / Open Graph 标签,待与用户确认后添加(见 CLAUDE.md「尚未锁定事项」) -->
  <!-- TODO: 姓名文案确定后更新 <title> -->
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    Bento 网格布局(见 CLAUDE.md「页面结构」):桌面端一屏内完整展示全部
    模块,不出现滚动条;平板简单 2 栏堆叠;手机端(<768px)是 Apple
    Wallet 风格的层叠卡片(见 #mobile-stack),不是网格也不是纵向堆叠。
    身份卡固定在最上方,不参与层叠顺序。

    #mobile-stack 包裹除身份卡外的六个模块:平板/桌面端它是
    display:contents(自己不生成盒子,子元素直接参与 .bento-grid 的
    网格布局,和不存在这层包裹时完全一样);只有手机端才变成层叠卡片的
    定位容器,子元素 position:absolute 由 render.js 按堆叠顺序摆放,
    支持 Pointer Events 拖拽切换。DOM 顺序即初始堆叠顺序(cineverse 在
    最前)。

    内容量较大的模块(Skills / Experience / CineVerse 技术亮点详情)可
    点击展开:用浏览器原生 View Transitions API(document.startViewTransition
    + view-transition-name)驱动"卡片变形为全屏面板"的过渡——卡片和
    面板动态共享同一个 view-transition-name,浏览器自动拍摄前后快照并
    插值动画,不需要手写 transform/opacity 同步逻辑。完整内容显示在一个
    独立的弹层里,每次点击都全新创建、关闭后彻底从 DOM 移除(document.
    createElement / remove(),不是复用同一个持久元素隐藏/显示)。原卡片
    自身只是 visibility:hidden,不 reparent、不做任何手写位移或形变
    (之前手写 FLIP 和手写弹层缩放两套机制先后都出过视觉异常,已放弃)。
    不支持该 API 的浏览器会跳过动画直接切换 DOM,核心功能不受影响。
    交互逻辑见 render.js。
  -->
  <main id="bento-grid" class="bento-grid">
    <section class="bento-card identity" id="card-identity" aria-label="Identity">
      <div id="identity-mount" class="mount"></div>
    </section>

    <div id="mobile-stack" class="mobile-stack">
      <section
        class="bento-card cineverse is-expandable"
        id="card-cineverse"
        data-expand="cineverse"
        tabindex="0"
        role="button"
        aria-haspopup="true"
        aria-expanded="false"
        aria-label="Featured project: CineVerse — click to view full details"
      >
        <div id="project-mount" class="mount"></div>
      </section>

      <section
        class="bento-card skills is-expandable"
        id="card-skills"
        data-expand="skills"
        tabindex="0"
        role="button"
        aria-haspopup="true"
        aria-expanded="false"
        aria-label="Skills — click to view full details"
      >
        <div id="skills-mount" class="mount"></div>
      </section>

      <section
        class="bento-card experience is-expandable"
        id="card-experience"
        data-expand="experience"
        tabindex="0"
        role="button"
        aria-haspopup="true"
        aria-expanded="false"
        aria-label="Experience — click to view full details"
      >
        <div id="experience-mount" class="mount"></div>
      </section>

      <section class="bento-card techstack" id="card-techstack" aria-label="Tech stack">
        <div id="techstack-mount" class="mount"></div>
      </section>

      <section class="bento-card stats" id="card-stats" aria-label="Key stat">
        <div id="stats-mount" class="mount"></div>
      </section>

      <section class="bento-card contact" id="card-contact" aria-label="Contact">
        <div id="contact-mount" class="mount"></div>
      </section>
    </div>
  </main>

  <!-- 展开时的背景遮罩:固定定位,z-index 低于弹层(弹层 z-index:200,
       由 render.js 动态创建)、高于网格本身,点击可关闭。 -->
  <div id="expand-backdrop" class="expand-backdrop" aria-hidden="true"></div>

  <!-- 普通 script(非 type="module"):理由见 render.js 顶部注释 -->
  <script src="content.js"></script>
  <script src="render.js"></script>
</body>
</html>
