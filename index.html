<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- TODO: SEO / Open Graph 标签,待与用户确认后添加(见 CLAUDE.md「尚未锁定事项」) -->
  <!-- TODO: 姓名文案确定后更新 <title> -->
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <button
        id="sidebar-toggle"
        class="sidebar-toggle"
        type="button"
        aria-label="Toggle sidebar menu"
        aria-expanded="false"
        aria-controls="sidebar-mount"
      >
        <span class="sidebar-toggle-bar"></span>
        <span class="sidebar-toggle-bar"></span>
        <span class="sidebar-toggle-bar"></span>
      </button>

      <div id="sidebar-mount" class="mount"></div>
    </aside>

    <div class="content">
      <nav id="tab-nav" class="tab-nav" role="tablist">
        <ul id="tab-list" class="tab-list"></ul>
      </nav>

      <main id="tab-panels" class="tab-panels">
        <section id="panel-about" class="tab-panel" data-tab="about" role="tabpanel" aria-labelledby="tab-about">
          <div id="about-mount" class="mount"></div>
        </section>

        <section id="panel-skills" class="tab-panel" data-tab="skills" role="tabpanel" aria-labelledby="tab-skills">
          <div id="skills-mount" class="mount"></div>
        </section>

        <section id="panel-project" class="tab-panel" data-tab="project" role="tabpanel" aria-labelledby="tab-project">
          <div id="project-mount" class="mount"></div>
        </section>

        <section id="panel-experience" class="tab-panel" data-tab="experience" role="tabpanel" aria-labelledby="tab-experience">
          <div id="experience-mount" class="mount"></div>
        </section>

        <section id="panel-contact" class="tab-panel" data-tab="contact" role="tabpanel" aria-labelledby="tab-contact">
          <div id="contact-mount" class="mount"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- 普通 script(非 type="module"):理由见 render.js 顶部注释 -->
  <script src="content.js"></script>
  <script src="render.js"></script>
</body>
</html>
